name: Update Syria Currency Rate

on:
  schedule:
      - cron: '0 * * * *'   # كل ساعتين — عدّل الرقم حسب رغبتك
  workflow_dispatch: {}       # يسمح بتشغيله يدوياً من تبويب Actions لأي وقت

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and push exchange rates
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          TOKEN: ${{ secrets.CURRENCY_TOKEN }}
          CURRENCIES: ${{ secrets.CURRENCIES }}
        run: python3 update_currency.py
